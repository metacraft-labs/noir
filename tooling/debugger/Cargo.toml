[package]
name = "noir_debugger"
description = "Debugger for Noir"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
build-data.workspace = true

[dependencies]
acvm.workspace = true
fm.workspace = true
nargo.workspace = true
noirc_printable_type.workspace = true
noirc_errors.workspace = true
noirc_artifacts.workspace = true
thiserror.workspace = true
codespan-reporting.workspace = true

# Only needed by the front-ends (`repl` and `dap` features). The stepping core
# is generic over `BlackBoxFunctionSolver`, so an embedder picks its own solver.
bn254_blackbox_solver = { workspace = true, optional = true }
dap = { workspace = true, optional = true }
easy-repl = { version = "0.2.1", optional = true }
owo-colors = { version = "^4.2.2", optional = true }

[features]
default = ["repl", "dap"]

# Resolve oracle calls against a JSON-RPC server.
#
# Execution currently uses HTTP based Oracle resolvers; does not compile to Wasm.
rpc = ["nargo/rpc"]

# The interactive terminal front-end which backs `nargo debug`.
repl = ["dep:easy-repl", "dep:owo-colors", "dep:bn254_blackbox_solver", "rpc"]

# The Debug Adapter Protocol server front-end which backs `nargo dap`.
dap = ["dep:dap", "dep:bn254_blackbox_solver", "rpc"]

[dev-dependencies]
assert_cmd = "2.2.2"
rexpect = "0.7"
tempfile.workspace = true
