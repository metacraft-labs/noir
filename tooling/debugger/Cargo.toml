[package]
name = "noir_debugger"
description = "Debugger for Noir"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
build-data.workspace = true

[dependencies]
acvm.workspace = true
fm.workspace = true
nargo.workspace = true
noirc_printable_type.workspace = true
noirc_errors.workspace = true
noirc_artifacts.workspace = true
thiserror.workspace = true
codespan-reporting.workspace = true
bn254_blackbox_solver.workspace = true

# Interactive front-end dependencies. Optional so that the crate's
# platform-agnostic core (`context`, `foreign_calls`) can be built for targets
# with no terminal and no sockets -- notably `wasm32-unknown-unknown`.
dap = { workspace = true, optional = true }
easy-repl = { version = "0.2.1", optional = true }
owo-colors = { version = "^4.2.2", optional = true }

[features]
# The native default: the full debugger, exactly as before this crate was
# feature-gated.
default = ["cli"]

# The interactive front-ends: the `nargo debug` REPL and the DAP server, plus
# the terminal source-code printer they share.
cli = ["dep:dap", "dep:easy-repl", "dep:owo-colors", "rpc"]

# Oracle resolution over HTTP. `nargo`'s own comment: "Execution currently uses
# HTTP based Oracle resolvers; does not compile to Wasm." Pulls
# jsonrpsee/http-client + tokio/rt + rand, and transitively `mio`, which has a
# hard `compile_error!` on wasm targets.
rpc = ["nargo/rpc"]

[dev-dependencies]
assert_cmd = "2.0.12"
rexpect = "0.5.0"
tempfile.workspace = true
