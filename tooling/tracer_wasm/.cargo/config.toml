[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = [
  '--cfg', 'getrandom_backend="wasm_js"',
  # The Noir frontend recurses over the AST deeply enough that `nargo` spawns
  # its parser threads with an 8 MiB stack rather than the 2 MiB default. wasm
  # has one stack, sized at link time, and `wasm-ld` defaults it to 1 MiB --
  # which the standard library's parse and the monomorphizer both overflow.
  # An overflow here is silent: the shadow stack walks down past address 0 into
  # static data instead of trapping. Hence the explicit, generous size.
  '-C', 'link-arg=-zstack-size=16777216',
]
