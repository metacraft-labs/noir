name: Upstream drift

# Why this workflow exists, and why it is shaped the way it is.
#
# This fork carries the CodeTracer tracer (`tooling/tracer`, `tooling/tracer_wasm`,
# `nargo trace`). It drifted **eight upstream releases** behind noir-lang/noir
# without anyone noticing, and one of the things that broke on the way back
# (`x *= y` silently stopped being instrumented) corrupted recorded traces
# without failing a build. Distance from upstream is therefore a thing this
# repository has to *measure*, not a thing someone remembers to check.
#
# Three constraints shaped this file, all of them measured on the fork rather
# than assumed:
#
#   1. **This job is pure git, so it needs no toolchain at all.** It was
#      originally written that way because it *could* not use cargo: the
#      workspace root declared `codetracer_trace_types` and
#      `codetracer_trace_writer_nim` as `../codetracer-trace-format/...` *path*
#      dependencies, i.e. on a sibling repository that does not exist in a bare
#      checkout, and because the declaration sat at the workspace root nothing
#      resolved — not even `cargo metadata` — so every scheduled Rust job
#      inherited from upstream died before compiling anything with
#      `failed to load manifest for workspace member .../tooling/tracer`.
#
#      **That is no longer true.** Those two are git dependencies pinned by
#      revision (root `Cargo.toml`), and `cargo metadata --locked` now succeeds
#      in a checkout with no siblings present — measured 2026-09-03 on
#      cargo 1.89.0, the version this repository's `rust-toolchain.toml`
#      selects. The inherited Rust jobs are therefore unblocked; whether they
#      are also *correct* for this fork is a separate question this comment
#      does not answer.
#
#      This job stays pure git because git is all it needs, not because cargo
#      is unavailable.
#
#   2. **`push` is not a usable trigger on this fork.** Every inherited
#      workflow is gated on `push: branches: [master]`, and this fork's
#      development branch is `codetracer` (`origin/master` is a dead 2023
#      mirror). The GitHub API reports **zero** `push` and **zero**
#      `pull_request` workflow runs for the whole repository. So the trigger
#      list below names the branches this fork actually uses.
#
#   3. **It must fail, not merely report.** Both forks were already pinned to a
#      release when they drifted. What was missing was not the pin: it was
#      anyone being told how old the pin had become. `DRIFT_MAX_BEHIND` is two
#      releases, i.e. roughly six weeks at upstream's ~3-week beta cadence, and
#      still a diff a human can read.

on:
  schedule:
    # Weekly, Monday 07:00 UTC. Upstream cuts a beta roughly every three weeks,
    # so weekly is frequent enough to catch a new release in its first week and
    # infrequent enough not to become noise.
    - cron: "0 7 * * 1"
  push:
    branches:
      - codetracer
  pull_request:
  workflow_dispatch:
    inputs:
      max_behind:
        description: "Fail if any tracked ref is more than this many releases behind"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  drift:
    name: distance from noir-lang/noir
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        # Pinned by SHA, matching every other workflow in this repository.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` needs the full history; `scripts/upstream-drift.sh`
          # fetches upstream's tags on top of it. A shallow clone reports no
          # drift at all, which is exactly the failure mode this job exists to
          # prevent.
          fetch-depth: 0

      - name: Report drift
        env:
          DRIFT_MAX_BEHIND: ${{ github.event.inputs.max_behind || '2' }}
        run: |
          # `HEAD` is the branch this ran on: `codetracer` for the weekly
          # schedule (it is the default branch), the pushed branch on a push,
          # and the merge result on a pull request — which is what makes this
          # job able to block a change that would move the pin backwards.
          ./scripts/upstream-drift.sh HEAD
