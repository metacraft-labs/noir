[package]
name = "noir_wasm"
description = "A JS interface to the Noir compiler"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
fm.workspace = true
noirc_driver.workspace = true
noirc_frontend = { workspace = true, features = ["bn254"] }
noirc_errors.workspace = true
noirc_artifacts.workspace = true
wasm-bindgen.workspace = true
serde.workspace = true
# `src/vfs.rs` reads `Nargo.toml` inside the module rather than in JavaScript, so the
# manifest parser has to be here. `toml::Spanned` is what lets a refusal name the LINE the
# offending dependency sits on rather than only the file.
toml.workspace = true
# The bare C ABI in `src/compile_vfs.rs` carries its request and its answer as JSON,
# because a `(ptr, len)` pair per argument is a C ABI that changes every time a knob is
# added.
serde_json.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
gloo-utils.workspace = true
tracing-subscriber.workspace = true
tracing-web.workspace = true

# Cannot use the `rpc` feature because the HTTP dependency wouldn't compile to Wasm.
# We could use `path` if `rpc` was a default feature, but we made it opt-in so we don't get any problems when publishing the workspace.
nargo.workspace = true

# This is an unused dependency, we are adding it
# so that we can enable the js feature in getrandom.
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_v2 = { package = "getrandom", version = "^0.2.0", features = ["js"] }
getrandom_v4 = { package = "getrandom", version = "0.4.0-rc.0", features = ["wasm_js"] }

# This is an unused dependency, we are adding it
# so that we can enable the debug-embed feature in rust-embed.
# This is needed for rust-embed to include the stdlib sources in dev mode
# while simultaneously allowing us to deactivate wasm-opt for speed.
rust-embed = { workspace = true, features = ["debug-embed"] }

[build-dependencies]
build-data.workspace = true

# A DEV dependency, deliberately: it does not enter the `cdylib` this crate ships, so the
# deployed module's bytes are unaffected by its presence. It is here because the question
# "does a contract compiled with `instrument_debug` + `force_brillig` produce an artifact a
# tracer can actually STEP?" cannot be answered by reading either crate — an uninstrumented
# artifact traces to one event and zero steps while both modules report success, which is
# the exact shape of a false pass. So `compile_vfs.rs`'s tests compile a contract here and
# hand it to the real tracer, and assert the step COUNT.
[dev-dependencies]
noir_tracer_wasm.workspace = true
# The event enum the trace is counted over, so the assertion matches a VARIANT rather
# than grepping serialized JSON for a substring.
codetracer_trace_types.workspace = true
# The ABI is what an all-zero input map is built against, so a contract function can be
# executed without this test knowing what its parameters mean.
noirc_abi.workspace = true
# The debug-symbol envelope is base64 of RAW deflate, and the listing test asserts the
# row count against what is inside it. Decoding it in the test — rather than trusting a
# comment about the shape — is the only way that assertion means anything.
base64.workspace = true
flate2.workspace = true
